<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vape Inspect History</title>
    <style>
        body { font-family: sans-serif; }
        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
        }
        .edit-btn {
            background-color: #4CAF50;
            color: white;
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 3px;
        }
        .back-btn {
            display: inline-block;
            margin: 20px 5%;
            background-color: #555;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <a href="{{ url_for('dashboard.view_vape_dashboard') }}" class="back-btn">← Back to Vape Dashboard</a>

    <h2 style="text-align: center;">Vape History</h2>
    {% if is_dummy_user %}
    <div style="background-color: #fef08a; color: #854d0e; padding: 12px; text-align: center; font-weight: bold; margin: 15px auto; max-width: 800px; border-radius: 6px; border: 1px solid #facc15;">
        ⚠️ Demo Mode Active (Viewing Demo User Records)
    </div>
    {% endif %}

    <table>
        <thead>
            <tr>
                <th>Date (Timestamp)</th>
                <th>Puff Count</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for record in history %}
            <tr>
                <td>{{ record.recorded_at }}</td>
                <td>{{ record.puff_count }}</td>
                <td>
                    <!-- Edit Button -->
                    <a href="{{ url_for('dashboard.edit_vape_page', record_id=record.id) }}" class="edit-btn">Edit</a>

                    <!-- Delete Button -->
                    <form action="{{ url_for('dashboard.delete_vape_measurement') }}" method="POST" style="display:inline;">
                        <input type="hidden" name="record_id" value="{{ record.id }}">
                        <button type="submit" onclick="return confirm('Are you sure you want to delete this record?');" style="background-color: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3">No records found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
